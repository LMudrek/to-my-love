<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para a Juju</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --navy:#1b3a5c;
    --mid-blue:#3d6d99;
    --cream:#f6f1e4;
    --white:#fffdf7;
    --brass:#a9852f;
    --line:#c9c0a6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'EB Garamond', serif;
    color:var(--navy);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- toldo listrado (awning header) ---------- */
  .awning{
    width:100%;
    background:repeating-linear-gradient(
      90deg,
      var(--white) 0px, var(--white) 40px,
      var(--navy) 40px, var(--navy) 80px
    );
    padding:0;
    position:relative;
    box-shadow:0 6px 18px rgba(27,58,92,0.18);
  }
  .awning-scallop{
    height:22px;
    width:100%;
    background:
      radial-gradient(circle at 20px 0, transparent 20px, var(--cream) 21px) 0 -1px / 40px 22px repeat-x;
  }
  .awning-inner{
    padding:44px 24px 32px;
    text-align:center;
    display:flex;
    justify-content:center;
  }
  .awning-plaque{
    background:rgba(27,58,92,0.42);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    padding:28px 40px;
    border:1px solid rgba(255,253,247,0.45);
    border-radius:6px;
    box-shadow:0 8px 32px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.25);
    max-width:90%;
  }
  .eyebrow{
    font-family:'EB Garamond', serif;
    font-style:italic;
    color:var(--white);
    letter-spacing:0.28em;
    text-transform:uppercase;
    font-size:12px;
    margin:0 0 10px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    color:var(--white);
    font-weight:500;
    font-size:clamp(34px,6vw,58px);
    letter-spacing:0.04em;
    margin:0;
    text-shadow:0 2px 12px rgba(0,0,0,0.35);
  }
  .subtitle{
    color:var(--white);
    font-style:italic;
    font-size:15px;
    margin:10px 0 0;
    opacity:0.9;
  }

  /* ---------- corpo ---------- */
  main{
    width:100%;
    max-width:640px;
    padding:56px 24px 90px;
  }

  .intro{
    text-align:center;
    font-style:italic;
    color:var(--mid-blue);
    font-size:17px;
    line-height:1.7;
    margin-bottom:56px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:22px 10px;
  }

  .verso{
    position:relative;
    border:1px solid var(--line);
    background:var(--white);
    padding:34px 30px;
    margin-bottom:28px;
    text-align:center;
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .verso::before,
  .verso::after{
    content:"";
    position:absolute;
    width:10px;height:10px;
    border:1px solid var(--brass);
  }
  .verso::before{top:8px;left:8px;border-right:none;border-bottom:none;}
  .verso::after{bottom:8px;right:8px;border-left:none;border-top:none;}

  .verso-dia{
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 14px;
  }
  .verso-texto{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(20px,3.4vw,26px);
    line-height:1.55;
    color:var(--navy);
    margin:0;
  }

  .verso.bloqueado{
    background:repeating-linear-gradient(
      135deg,
      var(--cream) 0px, var(--cream) 14px,
      #efe8d4 14px, #efe8d4 28px
    );
  }
  .verso.bloqueado .verso-texto{
    color:var(--mid-blue);
    opacity:0.55;
    font-style:italic;
  }
  .selo{
    display:inline-block;
    margin-top:14px;
  }

  /* ---------- cachorro salsicha animado ---------- */
  .salsicha-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .salsicha-legenda{
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--mid-blue);
    opacity:0.75;
  }
  .salsicha-video{
    width:250px;
    height:160px;
    object-fit:cover;
    border-radius:60%;
    border:2px solid var(--brass);
    box-shadow:0 6px 18px rgba(27,58,92,0.18);
  }

  .verso.final{
    border-color:var(--brass);
    border-width:2px;
  }
  .verso.final .verso-dia{color:var(--navy);}

  footer{
    width:100%;
    text-align:center;
    padding:26px 20px 40px;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--mid-blue);
    opacity:0.7;
  }

  @media (prefers-reduced-motion: reduce){
    .verso{transition:none;}
  }
</style>
</head>
<body>

  <div class="awning">
    <div class="awning-inner">
      <div class="awning-plaque">
        <p class="eyebrow">Uma carta em partes</p>
        <h1>Para a Juju</h1>
        <p class="subtitle">de Leo, aos poucos</p>
      </div>
    </div>
  </div>
  <div class="awning-scallop"></div>

  <main>
    <p class="intro">Cada dia revela uma parte. Volte amanhã.</p>
    <div id="versos"></div>
  </main>

  <footer>feito com o tempo, juntos ao lado de Deus</footer>

<script>
  // ---------- CONFIGURAÇÃO ----------
  const SALSICHA_FILES = [
    "salsicha_loop_cartoon_lower.mp4",
    "salsicha_praia_lower.mp4",
    "salsicha_praia_deitado_lower.mp4",
    "salsicha_coberta_lower.mp4",
    "salsicha_cheirando_lower.mp4",
    "salsicha_peludo_lower.mp4",
  ];

  // Embaralha a lista uma vez (Fisher-Yates) e vai puxando em ordem,
  // sem repetição, até esgotar — depois reembaralha e continua.
  let salsichaFila = [];
  function embaralhar(lista){
    const copia = [...lista];
    for(let i = copia.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }
  function proximoAsset(){
    if(salsichaFila.length === 0){
      salsichaFila = embaralhar(SALSICHA_FILES);
    }
    return salsichaFila.pop();
  }

  function salsichaHTML(){
    const asset = proximoAsset();
    return `
      <video class="salsicha-video" autoplay loop muted playsinline>
        <source src="assets/${asset}" type="video/mp4">
      </video>
    `;
  }

  // Data em que o primeiro verso é liberado (ano, mês-1, dia)
  const DATA_INICIO = new Date(2026, 7, 17); // segunda-feira, 17 de agosto de 2026
  DATA_INICIO.setHours(0,0,0,0);

  const teaser = {
    dia: "Domingo",
    texto: "Nós vamos ter uma conversa…"
  };

  const versos = [
    {
      dia: "Segunda-feira",
      texto: "Nossas vidas já estavam interligadas antes do nosso nascimento\n\nSeguimos separados, por um longo tempo"
    },
    {
      dia: "Terça-feira",
      texto: "Nos encontramos…\n\nPlantamos uma semente 6 anos atrás"
    },
    {
      dia: "Quarta-feira",
      texto: "O primeiro beijo não significou que iríamos continuar juntos naquele momento… naquele momento\n\nFomos cuidando e regando cada um de um lado"
    },
    {
      dia: "Quinta-feira",
      texto: "Plantamos uma semente 6 anos atrás\n\n"
    },
    {
      dia: "Sexta-feira",
      texto: "..."
    }
  ];

  function diasPassados(){
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    const diffMs = hoje - DATA_INICIO;
    return Math.floor(diffMs / 86400000);
  }

  function render(){
    const container = document.getElementById('versos');
    container.innerHTML = '';
    const liberados = diasPassados(); // 0 = primeiro verso liberado; negativo = ainda no teaser

    if(liberados < 0){
      const div = document.createElement('div');
      div.className = 'verso teaser';
      div.innerHTML = `
        <p class="verso-dia">${teaser.dia}</p>
        <p class="verso-texto">${teaser.texto}</p>
        <div class="selo">
          <div class="salsicha-wrap">
            ${salsichaHTML()}
            <p class="salsicha-legenda"></p>
          </div>
        </div>
      `;
      container.appendChild(div);
      return;
    }

    versos.forEach((v, i) => {
      const div = document.createElement('div');
      const desbloqueado = i <= liberados;
      const ehFinal = i === versos.length - 1;

      div.className = 'verso' + (desbloqueado ? '' : ' bloqueado') + (desbloqueado && ehFinal ? ' final' : '');

      if(desbloqueado){
        div.innerHTML = `
          <p class="verso-dia">${v.dia}</p>
          <p class="verso-texto">${v.texto.replace(/\n/g,'<br>')}</p>
        `;
      } else {
        div.innerHTML = `
          <p class="verso-dia">${v.dia}</p>
          <p class="verso-texto">ainda guardado…</p>
          <div class="selo">
            <div class="salsicha-wrap">
              ${salsichaHTML()}
              <p class="salsicha-legenda"></p>
            </div>
          </div>
        `;
      }
      container.appendChild(div);
    });
  }

  render();
</script>

</body>
</html>
